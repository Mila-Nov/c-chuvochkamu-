name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: flutter create --platforms=android .

      - name: Set app name and internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          android = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', android)
          tree = ET.parse(manifest)
          root = tree.getroot()
          name_key = f'{{{android}}}name'
          permission = 'android.permission.INTERNET'

          if not any(
              node.get(name_key) == permission
              for node in root.findall('uses-permission')
          ):
              root.insert(0, ET.Element('uses-permission', {name_key: permission}))

          application = root.find('application')
          if application is None:
              raise SystemExit('Application element was not found in AndroidManifest.xml')
          application.set(f'{{{android}}}label', 'Мой мир существ')
          tree.write(manifest, encoding='utf-8', xml_declaration=True)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-mirocumi-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
